# =========================================================================
# Validated Matrix Routing Configuration
# =========================================================================
matrix:
  # vars: One unique short name per specific model ID (alphanumeric, 1-8 chars)
  vars:
    # RAG & Utility Models (Small footprint)
    emb: "Qwen3-Embedding-8B-Q8_0"
    rer: "Qwen3-Reranker-8B.Q8_0"
    npuq: "qwen3.5:9b"
    q36n: "qwen3.6-moe:35b-a3b"
    npug: "gemma4-it:e4b"
    wsp: "whisper-v3:turbo"

    # Primary LLMs (Large footprint + Massive Context)
    gem431: "gemma-4-31B"
    mero: "MeroMero"
    gem426: "gemma-4-26B-A4B"
    q27: "Qwen3.8-27B"
    q36: "Qwen3.6-35B-A3B"

    # Image Generation Models (Large footprint)
    qimg: "Qwen-Image-2.1"
    flux: "FLUX.1-dev-Q8_0"

  # evict_costs: Relative cost of losing a running model
  evict_costs:
    emb: 20   # Keep embeddings loaded for immediate RAG readiness
    rer: 20   # Keep rerankers loaded
    npuq: 10  # Low cost; NPU models reload very quickly
    npug: 10
    wsp: 10
    gem431: 50   # High cost; Large LLM with huge context is slow to reload
    gem426: 50
    mero: 50
    q27: 50
    q36: 50
    q36n: 50
    qimg: 30  # Medium-high cost; Image models are heavy
    flux: 30

  # sets: Defines valid concurrent combinations using proper DSL operators
  sets:
    # Base building-block expressions
    gpu: "emb | rer | gem431 | gem426 | mero | q27 | q36 | qimg | flux"
    npu: "npuq | npug | wsp"

    # Compound pipelines using the mandatory '+' inline reference operator
    rag_chat: "(emb & rer) & (gem431 | gem426 | mero | q27 | q36)"
    rag_npu:  "(emb & rer) & +npu"
    npu_gpu: "+npu & +gpu"
